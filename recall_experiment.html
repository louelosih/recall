<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Recall Study</title>
<script src="https://cdn.jsdelivr.net/npm/jspsych@7.3.4/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-button-response@1.2.0/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-survey-text@1.1.3/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-survey-likert@1.1.3/dist/index.browser.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; font-size: 20px; line-height: 1.5; margin: 0; }
  .jspsych-content { max-width: 720px; margin: 0 auto; padding: 16px; text-align: center; }
  .jspsych-btn { font-size: 18px; padding: 12px 22px; margin: 8px; border-radius: 8px; border: 1px solid #888; cursor: pointer; }
  .cue { font-size: 40px; letter-spacing: 6px; font-family: monospace; display: block; margin: 20px 0; }
  .words { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; font-size: 26px; margin-top: 20px; }
  input[type=text] { font-size: 28px; padding: 8px; text-align: center; max-width: 90%; }
  .jspsych-survey-likert-opts { display: flex; justify-content: space-between; list-style: none; padding: 0; gap: 4px; font-size: 14px; }
  .small { font-size: 16px; opacity: .8; }
</style>
</head>
<body>
<script>
/* ============ SETTINGS (edit these) ============ */
const STUDY_MS = 30000;      // study time
const SHORT_BREAK_MS = 5000; // breaks between phases
const LONG_BREAK_MS = 10000; // break before debriefing
const TEST_A_MS = 145000;    // feedback test limit (2:25)
const TEST_B_MS = 120000;    // final test limit (2:00)
const TONE_MS = 500;         // tone duration
const GAIN = { ding: 0.30, engk: 0.30, neutral: 0.30 }; // calibrate each to ~65 dB with a sound level meter

const LISTS = {
  A: ['table','window','garden','pencil','basket','candle','mirror','ribbon','pocket','button',
      'bottle','jacket','lantern','blanket','market','kitchen','farmer','hammer','spider','doctor'],
  B: ['carpet','bucket','ladder','dinner','wallet','magnet','pillow','rocket','saddle','orange',
      'monkey','tunnel','feather','garlic','hunter','pepper','silver','cotton','ticket','sunset']
};

/* ============ TONES (generated, so no audio files are needed) ============ */
let ctx = null;
function tone(kind) {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  const t = ctx.currentTime, d = TONE_MS / 1000;
  const g = ctx.createGain(); g.connect(ctx.destination);
  const osc = (type, f) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.connect(g); o.start(t); o.stop(t + d); };
  const peak = GAIN[kind];
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.01);
  if (kind === 'ding') {                       // pleasant, bell-like, decaying
    osc('sine', 1046.5); osc('sine', 1568);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  } else if (kind === 'engk') {                // harsh, buzzy, low
    osc('sawtooth', 140); osc('square', 148);
    g.gain.setValueAtTime(peak, t + d - 0.02);
    g.gain.linearRampToValueAtTime(0.0001, t + d);
  } else {                                     // neutral beep
    osc('sine', 440);
    g.gain.setValueAtTime(peak, t + d - 0.02);
    g.gain.linearRampToValueAtTime(0.0001, t + d);
  }
}

/* ============ HELPERS ============ */
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
const isCorrect = (resp, target) => { const r = (resp || '').trim().toLowerCase(); return r !== '' && lev(r, target) <= 1; };
const cueOf = w => w.slice(0, 2) + ' ' + Array(w.length - 2).fill('_').join(' ');

/* ============ CONDITION AND LIST ASSIGNMENT ============ */
// Random by default. For equal group sizes, a coordinator can open the page with ?condition=...&list=...
const jsPsych = initJsPsych({ on_finish: showEnd });
const params = new URLSearchParams(location.search);
const CONDS = ['reinforcement', 'punishment', 'neutral'];
const cond = CONDS.includes(params.get('condition')) ? params.get('condition') : jsPsych.randomization.sampleWithoutReplacement(CONDS, 1)[0];
const listName = LISTS[params.get('list')] ? params.get('list') : jsPsych.randomization.sampleWithoutReplacement(['A', 'B'], 1)[0];
const words = LISTS[listName];
jsPsych.data.addProperties({ condition: cond, word_list: listName, start_time: new Date().toISOString() });

function feedback(correct) {
  if (cond === 'neutral') tone('neutral');
  else if (cond === 'reinforcement' && correct) tone('ding');
  else if (cond === 'punishment' && !correct) tone('engk');
}

/* ============ TRIAL BUILDERS ============ */
const btn = (stimulus, label = 'Continue', extra = {}) =>
  Object.assign({ type: jsPsychHtmlButtonResponse, stimulus, choices: [label] }, extra);
const pause = (text, ms, extra = {}) =>
  Object.assign({ type: jsPsychHtmlKeyboardResponse, stimulus: `<p>${text}</p>`, choices: 'NO_KEYS', trial_duration: ms }, extra);

let deadline = 0;
function testBlock(phase, ms, withTones) {
  const trial = {
    type: jsPsychSurveyText,
    questions: () => [{ prompt: `<span class="cue">${cueOf(jsPsych.timelineVariable('word', true))}</span>`, rows: 1, columns: 14, required: false }],
    button_label: 'Next',
    trial_duration: () => Math.max(300, deadline - Date.now()),
    data: { phase: phase, word: jsPsych.timelineVariable('word') },
    on_finish: (data) => {
      const resp = (data.response && data.response.Q0) || '';
      data.response_text = resp;
      data.correct = isCorrect(resp, data.word);
      if (withTones) feedback(data.correct);
    }
  };
  return [
    pause('Get ready…', 1000, { on_finish: () => { deadline = Date.now() + ms; } }),
    {
      timeline: [{ timeline: [trial], conditional_function: () => Date.now() < deadline }],
      timeline_variables: words.map(w => ({ word: w })),
      randomize_order: true
    }
  ];
}

/* ============ TIMELINE ============ */
const toneKind = { reinforcement: 'ding', punishment: 'engk', neutral: 'neutral' }[cond];
const timeline = [];

timeline.push(btn(
  `<h2>Word Recall Study</h2>
   <p>You will study a list of words and then be tested on them. Sounds will be played during the session and may be mildly unpleasant. Your participation is voluntary, and you may stop at any time without penalty. Your data are anonymous and identified only by a code.</p>`,
  'I agree to take part', {
    choices: ['I agree to take part', 'I do not agree'],
    on_finish: (d) => { if (d.response === 1) jsPsych.endExperiment('Thank you. You chose not to take part.'); }
  }));

timeline.push({
  type: jsPsychSurveyText,
  preamble: '<p>Please enter the following.</p>',
  questions: [
    { prompt: 'Participant code', required: true, name: 'participant_code' },
    { prompt: 'First language (English, Filipino, Ilocano, other)', required: true, name: 'first_language' }
  ],
  data: { phase: 'info' }
});

timeline.push({
  timeline: [{
    type: jsPsychHtmlButtonResponse,
    stimulus: '<p>Sound check: press "Play sound", then tell us whether you could hear it clearly.</p>',
    choices: ['Play sound', 'I heard it clearly', 'I could not hear it'],
    data: { phase: 'tone_check' },
    on_finish: (d) => {
      if (d.response === 0) tone('neutral');
      if (d.response === 2) jsPsych.endExperiment('Thank you. The sound check was not passed, so the session ends here.');
    }
  }],
  loop_function: (data) => data.last(1).values()[0].response === 0
});

timeline.push(btn(
  `<p>You will study 20 words for 30 seconds. After a short break, you will be shown the first two letters of each word and asked to type the full word.</p>
   <p>Sounds may play after your answers. Try to remember as many words as you can.</p>
   <p class="small">Press the button when you are ready to study.</p>`,
  'Start studying'));

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<p>Memorize these words:</p><div class="words">${jsPsych.randomization.shuffle(words).map(w => `<div>${w}</div>`).join('')}</div>`,
  choices: 'NO_KEYS', trial_duration: STUDY_MS, data: { phase: 'study' }
});
timeline.push(pause('Short break…', SHORT_BREAK_MS));

timeline.push(...testBlock('A', TEST_A_MS, true));
timeline.push(pause('Short break…', SHORT_BREAK_MS));

timeline.push(btn('<p>Final test. Type each word from its first two letters. No sounds will play now.</p>', 'Begin'));
timeline.push(...testBlock('B', TEST_B_MS, false));

timeline.push({
  type: jsPsychSurveyLikert,
  preamble: `<p>Press the button to hear the sound again, then rate it.</p>
             <button type="button" class="jspsych-btn" onclick="tone('${toneKind}')">Play sound</button>`,
  questions: [{
    prompt: 'How pleasant was this sound?',
    labels: ['1 Very unpleasant', '2', '3', '4', '5', '6', '7 Very pleasant'],
    required: true, name: 'pleasantness'
  }],
  data: { phase: 'manipulation_check', tone_rated: toneKind }
});

timeline.push(pause('Take a short break…', LONG_BREAK_MS));

timeline.push(btn(
  `<h3>Debriefing</h3>
   <p>This study tested whether the kind of sound played after your answers (a pleasant "ding" after correct answers, an unpleasant "engk" after wrong answers, or the same neutral beep after every answer) affects how many words you can recall later. Your score on the final test with no sounds is the main measure. Please ask the researcher any questions.</p>`));

timeline.push(btn('<p>Thank you for your time! Please collect your token of appreciation from the researcher.</p>', 'Finish'));

jsPsych.run(timeline);

/* ============ END SCREEN AND DATA DOWNLOAD ============ */
function showEnd() {
  const score = jsPsych.data.get().filter({ phase: 'B' }).select('correct').sum();
  document.body.innerHTML = `<div class="jspsych-content">
    <h2>Session complete</h2>
    <p class="small">Researcher use: final test score ${score} / ${words.length} (condition: ${cond}, list ${listName}).</p>
    <button class="jspsych-btn" id="dl">Download data (CSV)</button></div>`;
  document.getElementById('dl').onclick = () => {
    const blob = new Blob([jsPsych.data.get().csv()], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'recall_data_' + Date.now() + '.csv';
    a.click();
  };
}
</script>
</body>
</html>
